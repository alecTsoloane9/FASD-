name: fasd tst

on:
push:
  branches: [main]
pull_request:
  branches: [main]

  jobs:

   build-and-test: 
      runs-on: ubuntu latest

      steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setting up flutter
        uses: subosito/flutter-action@v2
        with: 
         flutter-version: '3.13.0'

      - name:  Install dependencies
        run:  flutter pub get
          
      - name: Analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test
         
   


